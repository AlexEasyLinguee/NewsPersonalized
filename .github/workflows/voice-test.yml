# Test rapide des voix : enregistre 2 articles de l'édition en ligne, en français et en anglais,
# et garde les MP3 dans les artefacts de l'exécution, pour les écouter. Ne publie rien.
name: Test des voix
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang: [fr, en]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: for i in 1 2 3; do pip install --quiet ptts kokoro-onnx soundfile imageio-ffmpeg && break; sleep 15; done
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: phonon-${{ matrix.lang }}-v1
      - uses: actions/cache@v4
        with:
          path: kokoro
          key: kokoro-v1.0-int8
      - run: |
          mkdir -p kokoro test
          [ -f kokoro/kokoro.onnx ] || curl -sSL -o kokoro/kokoro.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx
          [ -f kokoro/voices.bin ] || curl -sSL -o kokoro/voices.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          curl -sSL -o test/edition.json https://alexeasylinguee.github.io/NewsPersonalized/edition.json
      - run: python3 scripts/audio.py ${{ matrix.lang }} test/edition.json test/audio
        env:
          KOKORO_DIR: kokoro
          AUDIO_SAMPLE: '2'
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: voix-${{ matrix.lang }}
          path: test/audio
