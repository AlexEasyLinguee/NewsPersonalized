name: Relais Cloudflare

on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/worker.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 6dd7866a3a8332f59c577c997242e7a1
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vérifier les secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Ajoute le secret CLOUDFLARE_API_TOKEN dans Settings › Secrets and variables › Actions."
            exit 1
          fi
      - name: Créer (si besoin) le stockage des notifications
        run: |
          ID=$(npx --yes wrangler@4 kv namespace list | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s.slice(s.indexOf("[")));const n=j.find(x=>x.title==="clair-push"||x.title==="clair-profil-clair-push");console.log(n?n.id:"")})')
          if [ -z "$ID" ]; then
            npx --yes wrangler@4 kv namespace create clair-push --binding CLAIR > /tmp/kv.txt 2>&1 || true
            cat /tmp/kv.txt
            ID=$(npx --yes wrangler@4 kv namespace list | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s.slice(s.indexOf("[")));const n=j.find(x=>x.title==="clair-push"||x.title==="clair-profil-clair-push");console.log(n?n.id:"")})')
          fi
          if [ -z "$ID" ]; then echo "::error::Impossible de créer le stockage KV"; exit 1; fi
          echo "Stockage KV : $ID"
          sed -i "s/__KV_ID__/$ID/" wrangler.toml
      - name: Déployer
        run: npx --yes wrangler@4 deploy
