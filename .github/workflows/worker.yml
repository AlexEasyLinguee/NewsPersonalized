name: Relais Cloudflare

on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/worker.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 6dd7866a3a8332f59c577c997242e7a1
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vérifier les secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Ajoute le secret CLOUDFLARE_API_TOKEN dans Settings › Secrets and variables › Actions."
            exit 1
          fi
      - name: Nettoyer le jeton (espaces, retours à la ligne, « Bearer »)
        run: |
          T=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]' | sed -E 's/^[Bb]earer//')
          echo "::add-mask::$T"
          echo "Longueur du jeton : ${#T} caractères (attendu : 40 à 53)"
          case "$T" in *[!A-Za-z0-9_-]*) echo "::warning::Le jeton contient des caractères inattendus : vérifie ce que tu as collé dans le secret.";; esac
          echo "CLOUDFLARE_API_TOKEN=$T" >> "$GITHUB_ENV"
      - name: Vérifier le jeton
        run: |
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log("Jeton :",j.success?j.result.status:JSON.stringify(j.errors))})'
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log("Comptes visibles :",j.success?j.result.map(a=>a.id+" "+a.name).join(", ")||"aucun":JSON.stringify(j.errors))})'
      - name: Créer (si besoin) le stockage des notifications
        run: |
          API=https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          LIST=$(curl -sS -H "$AUTH" "$API?per_page=100")
          ID=$(echo "$LIST" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.success){console.error("Erreur Cloudflare (liste) :",JSON.stringify(j.errors));process.exit(1)}const n=j.result.find(x=>x.title==="clair-push");console.log(n?n.id:"")})')
          if [ -z "$ID" ]; then
            ID=$(curl -sS -X POST -H "$AUTH" -H "Content-Type: application/json" -d '{"title":"clair-push"}' "$API" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.success){console.error("Erreur Cloudflare (création) :",JSON.stringify(j.errors));process.exit(1)}console.log(j.result.id)})')
          fi
          echo "Stockage KV : $ID"
          sed -i "s/__KV_ID__/$ID/" wrangler.toml
      - name: Déployer
        run: npx --yes wrangler@4 deploy
