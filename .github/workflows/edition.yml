name: Édition du jour

on:
  schedule:
    - cron: '0 5 * * *'   # tous les jours à 5 h UTC (6 h à Paris en hiver, 7 h en été)
  workflow_dispatch:       # bouton « Run workflow » pour lancer à la main
  push:
    branches: [main]

permissions:
  contents: read
  models: read      # accès gratuit à GitHub Models via le jeton intégré
  pages: write
  id-token: write

concurrency:
  group: edition
  cancel-in-progress: false

jobs:
  edition:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Récupérer et trier les actus
        run: node scripts/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
