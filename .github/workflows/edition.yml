name: Édition du jour

# - Chaque matin (et sur « Run workflow ») : nouvelle édition triée par l'IA, publiée tout de suite,
#   puis le journal audio (voix Kokoro, FR et EN en parallèle), publié dès qu'il est prêt.
# - À chaque modification du code de l'app : l'app est republiée en ~1 min avec l'édition et l'audio
#   déjà en ligne, sans tout recalculer.

on:
  schedule:
    # GitHub peut retarder (voire sauter) les tâches planifiées, surtout à l'heure pile :
    # plusieurs essais à des minutes « creuses » ; ceux qui arrivent après une édition déjà faite s'arrêtent tout seuls.
    - cron: '23 3 * * *'   # 4 h 23 à Paris (hiver)
    - cron: '41 4 * * *'
    - cron: '13 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['worker/**', '.github/workflows/worker.yml', 'README.md']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: edition-${{ github.event_name == 'push' && 'app' || 'build' }}
  cancel-in-progress: false

env:
  SITE: https://alexeasylinguee.github.io/NewsPersonalized

jobs:
  # ---------- Mise à jour de l'app seule ----------
  app:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Reprendre l'édition et l'audio déjà en ligne
        run: node scripts/fetch-live.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
          name: pages-app-${{ github.run_attempt }}   # nom unique par tâche et par tentative : les relances ne se gênent pas
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-app-${{ github.run_attempt }}
      # GitHub met parfois quelques secondes à « voir » le paquet envoyé : on réessaie une fois.
      - if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-app-${{ github.run_attempt }}

  # ---------- Nouvelle édition ----------
  check:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.fresh.outputs.skip }}
    steps:
      - name: Édition du jour déjà faite ?
        id: fresh
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          GEN=$(curl -sS "$SITE/edition.json?t=$(date +%s)" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("generated_at",""))' 2>/dev/null || true)
          AGE=$(python3 -c "import datetime as d;g='$GEN';print(int((d.datetime.now(d.timezone.utc)-d.datetime.fromisoformat(g.replace('Z','+00:00'))).total_seconds()//3600) if g else 99)")
          echo "Édition en ligne : $GEN (il y a $AGE h)"
          if [ "$AGE" -lt 6 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "Déjà faite ce matin : rien à faire."; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

  edition:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Récupérer et trier les actus
        run: node scripts/build.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: edition
          path: docs/edition.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
          name: pages-edition-${{ github.run_attempt }}   # nom unique par tâche et par tentative : les relances ne se gênent pas
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-edition-${{ github.run_attempt }}
      # GitHub met parfois quelques secondes à « voir » le paquet envoyé : on réessaie une fois.
      - if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-edition-${{ github.run_attempt }}

  audio:
    needs: edition
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang: [fr, en]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: edition
          path: docs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les voix (Phonon, et Kokoro en secours)
        run: |
          # ffmpeg vient de pip (binaire autonome) : plus de dépendance aux serveurs Ubuntu, parfois indisponibles.
          for i in 1 2 3; do pip install --quiet ptts kokoro-onnx soundfile imageio-ffmpeg && break; sleep 15; done
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: phonon-${{ matrix.lang }}-v1
      - uses: actions/cache@v4
        with:
          path: kokoro
          key: kokoro-v1.0-int8
      - name: Télécharger le modèle (si pas en cache)
        run: |
          mkdir -p kokoro
          [ -f kokoro/kokoro.onnx ] || curl -sSL -o kokoro/kokoro.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx
          [ -f kokoro/voices.bin ] || curl -sSL -o kokoro/voices.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - name: Enregistrer le journal audio
        run: python3 scripts/audio.py ${{ matrix.lang }} docs/edition.json docs/audio
        env:
          KOKORO_DIR: kokoro
          # Jeton Hugging Face (lecture) : nécessaire pour la voix française Phonon 40m, modèle « gated ».
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: audio-${{ matrix.lang }}
          path: docs/audio

  publish-audio:
    needs: [edition, audio]
    if: always() && needs.edition.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: edition
          path: docs
      - uses: actions/download-artifact@v4
        with:
          pattern: audio-*
          path: docs/audio
          merge-multiple: true
      - run: ls docs/audio || echo "Pas d'audio aujourd'hui"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
          name: pages-audio-${{ github.run_attempt }}   # nom unique par tâche et par tentative : les relances ne se gênent pas
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-audio-${{ github.run_attempt }}
      # GitHub met parfois quelques secondes à « voir » le paquet envoyé : on réessaie une fois.
      - if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-audio-${{ github.run_attempt }}
