<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clair</title>
<meta name="theme-color" content="#F6F7F4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Clair">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
  :root {
    --ground: #F6F7F4; --ink: #14201C; --muted: #5B6661; --card: #FFFFFF; --line: #E6EAE7;
    --green: #0B6E53; --green-soft: #DDF2E9; --amber: #8A4500; --amber-soft: #FFEED9;
    --blue: #1A4F9C; --blue-soft: #E3ECFA;
    --dark: #0F1D19; --dark-2: #1C312B; --mint: #9FE0C6; --dark-muted: #B7C7C0;
    --tabs-h: calc(64px + env(safe-area-inset-bottom));
    --display: 'Bricolage Grotesque', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ground); color: var(--ink); font-family: 'Manrope', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body.dark { background: var(--dark); }
  button { font-family: inherit; }
  a { color: var(--green); }
  .screen { display: none; min-height: 100%; padding-bottom: var(--tabs-h); }
  .screen.active { display: block; }
  .wrap { max-width: 520px; margin: 0 auto; }
  .hidden { display: none !important; }

  /* L'essentiel */
  header.top { padding: calc(20px + env(safe-area-inset-top)) 24px 16px; display: flex; flex-direction: column; gap: 4px; }
  .brand-row { display: flex; justify-content: space-between; align-items: center; }
  .brand { font-family: var(--display); font-weight: 700; font-size: 22px; color: var(--green); }
  .date { margin: 10px 0 0; font-size: 14px; font-weight: 600; color: var(--muted); }
  h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 36px; line-height: 1.05; }
  .sub { margin: 0; font-size: 15px; color: var(--muted); }
  .list { padding: 0 16px; display: flex; flex-direction: column; gap: 10px; }
  .card { background: var(--card); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: inherit; }
  .card h2 { margin: 0; font-size: 17px; line-height: 1.3; font-weight: 700; }
  .card p { margin: 0; font-size: 14px; line-height: 1.45; color: var(--muted); }
  .chips { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .chip { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
  .chip.important { color: var(--amber); background: var(--amber-soft); }
  .chip.good { color: var(--green); background: var(--green-soft); }
  .chip.world { color: var(--blue); background: var(--blue-soft); }
  .reason { font-size: 12px; font-weight: 600; color: var(--muted); }
  .cta { margin: 16px; height: 56px; border-radius: 16px; border: none; background: var(--green); color: #fff; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 16px; font-weight: 700; cursor: pointer; width: calc(100% - 32px); }
  .empty { margin: 24px; padding: 20px; border-radius: 16px; background: var(--card); color: var(--muted); line-height: 1.5; }
  .stale { margin: 0 16px 10px; padding: 10px 14px; border-radius: 12px; background: var(--amber-soft); color: var(--amber); font-size: 13px; font-weight: 600; }

  /* Le fil */
  #fil { padding-bottom: 0; }
  .feed { position: fixed; inset: 0 0 var(--tabs-h) 0; overflow-y: auto; scroll-snap-type: y mandatory; overscroll-behavior: contain; color: #fff; }
  .feed-head { position: fixed; top: 0; left: 0; right: 0; z-index: 5; padding: calc(12px + env(safe-area-inset-top)) 16px 10px; background: linear-gradient(var(--dark) 60%, transparent); pointer-events: none; }
  .feed-head .inner { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  .progress { display: flex; gap: 3px; }
  .progress i { flex: 1; height: 3px; border-radius: 2px; background: #2A3F39; }
  .progress i.done { background: var(--mint); }
  .head-row { display: flex; justify-content: space-between; align-items: center; }
  .chip.mint { color: var(--dark); background: var(--mint); }
  .counter { font-size: 13px; font-weight: 600; color: var(--dark-muted); }
  .slide { height: 100%; scroll-snap-align: start; scroll-snap-stop: always; display: flex; flex-direction: column; padding: calc(64px + env(safe-area-inset-top)) 16px 12px; max-width: 520px; margin: 0 auto; }
  .media { flex: 1 1 auto; min-height: 140px; border-radius: 22px; background: #24413A; overflow: hidden; display: flex; align-items: center; justify-content: center; color: #CFE3DA; }
  .media img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .slide-body { padding: 16px 4px 6px; display: flex; flex-direction: column; gap: 8px; }
  .slide h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1.15; }
  .slide p { margin: 0; font-size: 15px; line-height: 1.45; color: #C9D6D0; }
  .slide .meta { font-size: 13px; color: var(--dark-muted); }
  .slide .meta a { color: var(--mint); }
  .actions { display: flex; gap: 6px; padding-top: 6px; flex-wrap: wrap; }
  .icon-btn { width: 44px; height: 44px; border-radius: 22px; border: none; background: var(--dark-2); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .icon-btn.on { background: var(--mint); color: var(--dark); }
  .pill-btn { height: 44px; padding: 0 14px; border-radius: 22px; border: none; background: var(--dark-2); color: #C9D6D0; font-size: 13px; font-weight: 600; cursor: pointer; }

  /* Fin */
  .end { justify-content: center; align-items: center; text-align: center; gap: 14px; padding-left: 24px; padding-right: 24px; background: var(--ground); color: var(--ink); max-width: none; }
  .end > * { max-width: 420px; width: 100%; }
  .check { width: 88px; height: 88px; border-radius: 44px; background: var(--green-soft); color: var(--green); display: flex; align-items: center; justify-content: center; }
  .end h2 { font-size: 38px; color: var(--ink); }
  .end p { color: var(--muted); font-size: 16px; line-height: 1.5; }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
  .stat { background: var(--card); border-radius: 14px; padding: 14px 8px; display: flex; flex-direction: column; gap: 2px; }
  .stat b { font-family: var(--display); font-size: 26px; }
  .stat span { font-size: 12px; color: var(--muted); }
  .note { background: var(--card); border-radius: 14px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; text-align: left; font-size: 14px; }
  .outline-btn { height: 52px; border-radius: 16px; border: 1.5px solid #C9D2CE; background: transparent; color: var(--ink); font-size: 15px; font-weight: 700; cursor: pointer; }

  /* Réglages */
  .settings { padding: calc(20px + env(safe-area-inset-top)) 20px 28px; display: flex; flex-direction: column; gap: 22px; }
  .settings h1 { font-size: 30px; }
  .settings h2 { margin: 0 0 10px; font-size: 15px; font-weight: 700; }
  .settings .hint { margin: -4px 0 10px; font-size: 13px; color: var(--muted); }
  .seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; background: var(--line); padding: 4px; border-radius: 14px; }
  .seg button { height: 44px; border: none; border-radius: 11px; font-size: 14px; font-weight: 700; cursor: pointer; background: transparent; color: #4A5550; }
  .seg button[aria-pressed="true"] { background: #fff; color: var(--green); }
  .desc { margin: 10px 0 0; font-size: 14px; line-height: 1.45; color: var(--muted); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { height: 36px; padding: 0 6px 0 14px; border-radius: 18px; background: #fff; display: flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600; }
  .tag button { width: 28px; height: 28px; border: none; background: transparent; color: var(--muted); font-size: 16px; cursor: pointer; border-radius: 14px; }
  .add-row { display: flex; gap: 8px; margin-top: 10px; }
  .add-row input { flex: 1; height: 44px; border-radius: 12px; border: 1.5px solid #D7DDDA; padding: 0 12px; font: inherit; font-size: 15px; background: #fff; min-width: 0; }
  .add-row button { height: 44px; padding: 0 16px; border-radius: 12px; border: none; background: var(--green); color: #fff; font-weight: 700; cursor: pointer; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .toggle { min-height: 44px; padding: 8px 12px; border-radius: 12px; font-size: 13px; font-weight: 700; text-align: left; line-height: 1.25; cursor: pointer; border: 1.5px solid #D7DDDA; background: #fff; color: #4A5550; }
  .toggle[aria-pressed="true"] { border-color: var(--green); background: var(--green-soft); color: #08523E; }
  .count-row { display: flex; justify-content: space-between; align-items: center; background: #fff; border-radius: 14px; padding: 10px 10px 10px 16px; }
  .count-row .btns { display: flex; gap: 6px; }
  .round { width: 44px; height: 44px; border-radius: 22px; border: none; background: var(--line); color: var(--ink); font-size: 20px; font-weight: 700; cursor: pointer; }
  .small { font-size: 12px; color: var(--muted); }

  /* Barre d'onglets */
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; height: var(--tabs-h); padding-bottom: env(safe-area-inset-bottom); background: var(--ground); border-top: 1px solid var(--line); display: flex; justify-content: space-around; z-index: 10; }
  nav.tabs button { flex: 1; max-width: 140px; border: none; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 600; color: var(--muted); cursor: pointer; }
  nav.tabs button[aria-current="page"] { color: var(--green); font-weight: 700; }
  body.dark nav.tabs { background: var(--dark); border-top-color: #1F3530; }
  body.dark nav.tabs button { color: var(--dark-muted); }
  body.dark nav.tabs button[aria-current="page"] { color: var(--mint); }

  /* Profil */
  .profile-form { padding: calc(28px + env(safe-area-inset-top)) 20px 40px; }
  .profile-form h1 { font-size: 32px; }
  .profile-form textarea { margin-top: 16px; width: 100%; min-height: 200px; border-radius: 16px; border: 1.5px solid #D7DDDA; padding: 14px; font: inherit; font-size: 16px; line-height: 1.45; background: #fff; color: var(--ink); resize: vertical; }
  .profile-form textarea:focus, .add-row input:focus { outline: 2px solid var(--green); outline-offset: 1px; }
  .profile-form .cta:disabled { background: #9AA6A1; cursor: default; }
  .profile-box { background: #fff; border-radius: 16px; padding: 16px; }
  .profile-box .tag { background: var(--ground); }
  .link-btn { display: block; margin: 14px auto 0; min-height: 44px; padding: 0 12px; border: none; background: none; color: var(--green); font-size: 15px; font-weight: 700; cursor: pointer; }
  .error { margin: 10px 0 0; padding: 10px 14px; border-radius: 12px; background: #FDE8E6; color: #A1261B; font-size: 14px; font-weight: 600; }
  .why { font-size: 12px; font-weight: 700; color: var(--mint); }
  /* Récompenses */
  .progress i.read { background: #34D399; }
  .reward { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%); z-index: 30; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; animation: reward-out 0.9s ease forwards; }
  .reward-dot { width: 88px; height: 88px; border-radius: 44px; background: #22C55E; color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 30px rgba(34, 197, 94, 0.45); animation: reward-pop 0.45s cubic-bezier(.2, 1.6, .4, 1) both; }
  .reward span { font-size: 15px; font-weight: 800; color: #fff; background: rgba(15, 29, 25, 0.75); padding: 4px 12px; border-radius: 999px; }
  .reward.big { animation-duration: 1.6s; }
  .reward.big .reward-dot { width: 120px; height: 120px; border-radius: 60px; }
  @keyframes reward-pop { 0% { transform: scale(0.3); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes reward-out { 0%, 70% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -60%); } }
  @media (prefers-reduced-motion: reduce) { .reward, .reward-dot { animation: none; } }
  .note.streak { background: #FFF4E5; color: #7A3E00; font-weight: 700; }
  .seg.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .lang-top { display: flex; justify-content: flex-end; margin-bottom: 18px; }
  .lang-top .seg { width: 220px; }
  /* Amis */
  nav.tabs button { max-width: 110px; font-size: 11px !important; white-space: nowrap; }
  .tab-icon { position: relative; display: inline-flex; }
  .badge { position: absolute; top: -6px; right: -10px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: #E11D48; color: #fff; font-size: 10px; font-weight: 800; line-height: 16px; text-align: center; }
  .code-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .friend-code { font-family: var(--display); font-size: 30px; letter-spacing: 2px; color: var(--green); }
  .shared-note { margin: 0; font-size: 15px; font-style: italic; color: var(--mint); }
  .shared-note.dark { color: var(--green); }
  .card.unread { box-shadow: inset 4px 0 0 #22C55E; }
  .sheet { position: fixed; inset: 0; z-index: 40; background: rgba(15, 29, 25, 0.45); display: flex; align-items: flex-end; justify-content: center; }
  .sheet-card { width: 100%; max-width: 520px; background: var(--ground); color: var(--ink); border-radius: 22px 22px 0 0; padding: 22px 20px calc(20px + env(safe-area-inset-bottom)); }
  .sheet-card h2 { margin: 0 0 6px; font-family: var(--display); font-size: 24px; }
  .sheet-card textarea { margin-top: 12px; width: 100%; min-height: 80px; border-radius: 14px; border: 1.5px solid #D7DDDA; padding: 12px; font: inherit; font-size: 16px; background: #fff; resize: none; }
  .later { margin: 0 16px 12px; padding: 14px 16px; border-radius: 16px; background: var(--green-soft); }
  .later h2 { margin: 0 0 8px; font-size: 15px; color: #08523E; }
  .later-item { display: flex; flex-direction: column; gap: 2px; padding: 10px 0; border-top: 1px solid #BFE3D3; text-decoration: none; color: var(--ink); }
  .later-item b { font-size: 15px; line-height: 1.3; }
  .later-item span { font-size: 12px; color: var(--muted); }
  .fav-card { gap: 10px; }
  .fav-link { display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: inherit; }
  .fav-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-top: 4px; border-top: 1px solid var(--line); }
  .fav-actions .chip.offline-chip { margin-top: 0; padding: 0 12px; height: 36px; display: inline-flex; align-items: center; }
  .fav-btn { height: 36px; padding: 0 12px; border-radius: 18px; border: none; background: var(--green-soft); color: #08523E; font: inherit; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .fav-btn svg { width: 16px; height: 16px; }
  .fav-btn.icon-only { width: 44px; height: 36px; padding: 0; justify-content: center; background: var(--ground); color: var(--ink); }
  .fav-btn[data-fav-remove] { color: var(--green); }
  /* Écouter */
  .listen-btn { margin-top: 14px; align-self: flex-start; height: 44px; padding: 0 18px 0 14px; border-radius: 22px; border: none; background: var(--ink); color: #fff; font: inherit; font-size: 15px; font-weight: 700; display: inline-flex; align-items: center; gap: 10px; cursor: pointer; }
  .mini-player { position: fixed; left: 10px; right: 10px; bottom: calc(var(--tabs-h) + 8px); z-index: 12; max-width: 500px; margin: 0 auto; height: 56px; border-radius: 16px; background: var(--ink); color: #fff; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 16px; box-shadow: 0 6px 20px rgba(0,0,0,.25); cursor: pointer; }
  .mini-player span { flex: 1; min-width: 0; font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pl-mini-btn { width: 44px; height: 44px; border-radius: 22px; border: none; background: var(--mint); color: var(--dark); display: flex; align-items: center; justify-content: center; cursor: pointer; flex: none; }
  .player { position: fixed; inset: 0; z-index: 36; background: var(--dark); color: #fff; overflow-y: auto; }
  .player-body { padding: calc(10px + env(safe-area-inset-top)) 22px calc(30px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; }
  .player .link-btn { color: var(--mint); margin: 0 0 0 -12px; }
  .player .small { color: var(--dark-muted); }
  .pl-top { display: flex; justify-content: space-between; align-items: center; }
  .pl-art { margin: 10px auto 18px; width: min(72vw, 300px); aspect-ratio: 1; border-radius: 24px; background: #24413A; color: var(--mint); overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .pl-art img { width: 100%; height: 100%; object-fit: cover; }
  .pl-cat { margin: 0; font-size: 13px; font-weight: 700; color: var(--mint); }
  .pl-title { margin: 6px 0 4px; font-family: var(--display); font-size: 23px; line-height: 1.2; }
  .pl-bar { margin-top: 16px; height: 4px; border-radius: 2px; background: #2A3F39; overflow: hidden; }
  .pl-bar i { display: block; height: 100%; width: 0; background: var(--mint); }
  .pl-time { margin: 6px 0 0; font-variant-numeric: tabular-nums; }
  .pl-controls { margin-top: 14px; display: flex; justify-content: center; align-items: center; gap: 12px; }
  .pl-controls .round { background: var(--dark-2); color: #fff; font-size: 13px; }
  .pl-play { width: 72px; height: 72px; border-radius: 36px; border: none; background: var(--mint); color: var(--dark); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .pl-play svg { width: 30px; height: 30px; }
  .player .toggle { background: var(--dark-2); color: #C9D6D0; border-color: #2A3F39; }
  .player .toggle[aria-pressed="true"] { background: var(--mint); color: var(--dark); border-color: var(--mint); }
  .pl-queue { list-style: none; margin: 22px 0 6px; padding: 0; border-top: 1px solid #1F3530; }
  .pl-queue li button { width: 100%; min-height: 48px; border: none; border-bottom: 1px solid #1F3530; background: none; color: #C9D6D0; font: inherit; font-size: 14px; text-align: left; display: flex; gap: 10px; align-items: center; padding: 8px 0; cursor: pointer; }
  .pl-queue li button span { width: 18px; flex: none; color: var(--mint); font-weight: 800; }
  .pl-queue li.now button { color: #fff; font-weight: 700; }
  .pl-queue li.done button { color: var(--dark-muted); }
  .reader { position: fixed; inset: 0; z-index: 35; background: var(--ground); color: var(--ink); overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .reader-body { padding: calc(14px + env(safe-area-inset-top)) 22px calc(40px + env(safe-area-inset-bottom)); }
  .reader-body h1 { font-size: 28px; line-height: 1.15; }
  .reader-back { margin: 0 0 0 -12px; }
  .reader-text { margin-top: 18px; }
  .reader-text p { margin: 0 0 16px; font-size: 18px; line-height: 1.6; color: #24302C; }
  .reader-text h2 { margin: 26px 0 10px; font-family: var(--display); font-size: 21px; line-height: 1.25; }
  .reader-orig { display: flex; align-items: center; justify-content: center; margin-top: 20px; padding: 0 16px; text-decoration: none; text-align: center; }
  .chip.offline-chip { align-self: flex-start; margin-top: 4px; padding: 6px 12px; color: #fff; background: var(--green); cursor: pointer; }
  .stale.offline { background: #E6EAE7; color: var(--ink); }
  .toast { position: fixed; left: 50%; bottom: calc(var(--tabs-h) + 16px); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; z-index: 20; max-width: 90vw; text-align: center; }
</style>
</head>
<body>

<main>
  <section id="essentiel" class="screen active" aria-label="L'essentiel">
    <div class="wrap">
      <header class="top">
        <div class="brand-row"><span class="brand">Clair</span></div>
        <p class="date" id="ess-date"></p>
        <h1 data-i18n="ess_title">L'essentiel</h1>
        <p class="sub" id="ess-sub"></p>
        <button type="button" class="listen-btn hidden" id="listen-btn"></button>
      </header>
      <div id="ess-stale"></div>
      <div id="ess-later"></div>
      <div class="list" id="ess-list"></div>
      <button class="cta" id="go-fil" type="button"></button>
    </div>
  </section>

  <section id="fil" class="screen" aria-label="Le fil">
    <div class="feed-head" aria-hidden="true">
      <div class="inner">
        <div class="progress" id="progress"></div>
        <div class="head-row"><span class="chip mint" id="fil-cat"></span><span class="counter" id="fil-counter"></span></div>
      </div>
    </div>
    <div class="feed" id="feed"></div>
  </section>

  <section id="reglages" class="screen" aria-label="Mon dosage">
    <div class="wrap settings" id="settings"></div>
  </section>

  <section id="profil" class="screen" aria-label="Parle-moi de toi">
    <div class="wrap profile-form" id="profil-body"></div>
  </section>

  <section id="amis" class="screen" aria-label="Amis">
    <div class="wrap settings" id="amis-body"></div>
  </section>

  <section id="favoris" class="screen" aria-label="Mes favoris">
    <div class="wrap">
      <header class="top"><h1 data-i18n="fav_title">Mes favoris</h1><p class="sub" data-i18n="fav_sub">Les cartes que tu as gardées.</p></header>
